version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
    groups:
      gtk:
        patterns:
          - "gtk4"
          - "glib"
          - "gio"
          - "epoxy"
      serde:
        patterns:
          - "serde"
          - "serde_json"
